<!doctype html>
<html>
  <body>
    <h2>Testing FastAPI CORS</h2>
    <button onclick="testAPI()">Call FastAPI</button>
    <script>
      async function testAPI() {
        try {
          const response = await fetch("http://localhost:5002/test-cors");
          const data = await response.json();
          console.log(data);
          alert(JSON.stringify(data));
        } catch (error) {
          console.error(error);
        }
      }
    </script>
  </body>
</html>
